[IA]
; ofensivo: procura e ataca inimigos automaticamente
; defensivo: protege o jogador num raio menor
; passivo: apenas acompanha o jogador
modo=ofensivo
raioBusca=12
distanciaSeguir=5
distanciaTeleportar=14
atacarAutomaticamente=1
usarHabilidades=1
; 0 evita que habilidades automaticas encham a tela com mensagens
mostrarAvisosHabilidades=0

[VISUAL]
; Mantenha 0 enquanto as folhas finais 8x6 nao forem instaladas.
; Isso evita o monstro gigante/corrompido e usa o sprite seguro do jogo.
usarSpritesExternas=0
